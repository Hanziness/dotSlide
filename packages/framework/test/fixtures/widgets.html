<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Widgets</title>
  <script type="module" src="../../src/index.ts"></script>
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      background: #222;
    }
    ds-slideshow {
      width: 100%;
      height: 100%;
    }
    ds-slide {
      padding: 4rem;
      box-sizing: border-box;
      font-family: system-ui, sans-serif;
      color: #222;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    ds-slide h2 {
      margin: 0;
    }
    .slide-footer {
      margin-top: auto;
      font-size: 1rem;
      color: #555;
    }
    ds-progress {
      display: block;
      color: #0d6efd;
    }
    ds-progress[data-display="bar"] {
      width: 50%;
    }
    .widget-grid {
      display: flex;
      gap: 1.5rem;
      align-items: baseline;
    }
    .widget-grid span {
      font-size: 1.5rem;
    }
  </style>
</head>
<body>
  <ds-slideshow data-slideshow-width="1280" data-slideshow-height="720">
    <ds-section level="1" title="Widgets"></ds-section>

    <ds-slide>
      <h2>Widgets</h2>
      <div class="widget-grid">
        <span>Section <ds-current-section></ds-current-section></span>
      </div>
      <ds-progress data-display="fraction"></ds-progress>
      <p class="slide-footer">
        Slide <ds-current-slide></ds-current-slide> of <ds-total-slides></ds-total-slides>
      </p>
    </ds-slide>

    <ds-slide>
      <h2>Percentage</h2>
      <ds-progress data-display="percentage"></ds-progress>
      <p class="slide-footer">
        Slide <ds-current-slide></ds-current-slide> of <ds-total-slides></ds-total-slides>
      </p>
    </ds-slide>

    <ds-slide>
      <h2>Progress bar</h2>
      <ds-progress data-display="bar"></ds-progress>
      <p class="slide-footer">
        Slide <ds-current-slide></ds-current-slide> of <ds-total-slides></ds-total-slides>
      </p>
    </ds-slide>

    <ds-keyboard-handler></ds-keyboard-handler>
    <ds-slide-controls></ds-slide-controls>
  </ds-slideshow>
</body>
</html>
